version: "v0.4"

project:
  name: "Prescribed holes in the time frequency plane and ptychographic phase retrieval"
  description: >-
    A Lean 4 formalization of the three main theorems of the paper "Prescribed
    holes in the time frequency plane and ptychographic phase retrieval" by
    J. de Dios Pont, P. Jaming, L. Liehr and M. A. Taylor. (1) Every nonzero
    window in L²(ℝᵈ) whose ambiguity function has a bounded open zero set does
    phase retrieval. (2) Every bounded regular open subset of ℝ²ᵈ is, after a
    sufficiently small rescaling and a translation away from the origin,
    together with its reflection the open zero set of an ambiguity function.
    (3) There is an annulus centered at the origin of ℝ² that is not contained
    in the open zero set of the ambiguity function of any nonzero function in
    L²(ℝ).
  authors:
    - "Jaume de Dios Pont"
    - "Philippe Jaming"
    - "Lukas Liehr"
    - "Mitchell A. Taylor"
  license: "Apache-2.0"
  responsible_maintainers:
    - "Lukas Liehr"

classification:
  arxiv: ["math.CA", "math.FA"]

sources:
  - title: "Prescribed holes in the time frequency plane and ptychographic phase retrieval"
    relationship: "formalizes"

automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 4.6", "Claude Opus 5"]
      tool_setup: >-
        The Lean proofs of the three theorems, that is, the library LeanCode
        which Solution.lean uses, were generated by AI agents on the basis of
        the paper. The definitions and the three theorem statements in
        Challenge.lean were curated and reviewed by the authors.
    - method: "agent"
      models: ["Claude Fable 5.2"]
      framework: "Claude Code"
      tool_setup: >-
        Preparation of the Palomar submission after the proofs were complete:
        move from Lean v4.29.0 to Lean v4.35.0 with Mathlib v4.35.0, which
        needed about 80 small proof repairs for changed Mathlib lemmas, port of
        the remaining Lean files to the module system, removal of declarations
        which no proof uses, the files Challenge.lean and Solution.lean,
        comparator.json and a draft of this file. No theorem statement was
        changed.

review:
  status: "author-verified"
  notes: >-
    Before the submission the authors checked the definitions and the three
    theorem statements in Challenge.lean against Theorems 1.1, 1.2 and 1.3 of
    the paper. The authors did not read the Lean proofs. Their correctness
    rests on the Lean kernel, checked with Comparator, and the proofs use only
    the axioms propext, Classical.choice and Quot.sound. No separate review
    took place.
